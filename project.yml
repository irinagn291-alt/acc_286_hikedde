name: Heddle
options:
  bundleIdPrefix: com.heddle
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Heddle:
    type: application
    platform: iOS
    sources:
    - path: Heddle
    resources:
    - path: PrivacyInfo.xcprivacy
    dependencies:
    - target: Alamofire
    - package: AppsFlyerLib
      product: AppsFlyerLib-Static
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heddle.bead
        PRODUCT_NAME: Heddle
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_CFBundleDisplayName: Сhikedde
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: 'YES'
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Heddle records a voice note onto today's knot. The clip stays on this device.
        INFOPLIST_KEY_UIAppFonts:
        - TrebuchetMS.ttf
        - TrebuchetMS-Bold.ttf
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Support/Heddle-Info.plist
  Alamofire:
    type: framework
    platform: iOS
    sources:
    - path: Alamofire
      excludes:
      - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heddle.bead.Alamofire
        PRODUCT_NAME: Alamofire
        GENERATE_INFOPLIST_FILE: 'YES'
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        DEFINES_MODULE: 'YES'
        BUILD_LIBRARY_FOR_DISTRIBUTION: 'NO'
        CODE_SIGN_STYLE: Automatic
        MACH_O_TYPE: staticlib
  HeddleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: HeddleTests
    dependencies:
    - target: Heddle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heddle.bead.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        SWIFT_VERSION: '6.2'
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Heddle.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Heddle
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
schemes:
  Heddle:
    build:
      targets:
        Heddle: all
        Alamofire: all
        HeddleTests:
        - test
    test:
      targets:
      - HeddleTests
packages:
  AppsFlyerLib:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework-Static
    from: 6.17.9
